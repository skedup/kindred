name: reach_out_to_user
description: 对方不在身边、彼此没有刚聊过，而生活里正有一件具体的事，很自然地想告诉 ta
uses:
  - action: compose
    intent: 从刚经历的活动、观察或想法里，酝酿一句此刻真想和 ta 分享的话
  - action: send
    intent: 决定了，把话发出去，主动联系 ta
terminal_when: |
  话发出去了（send 完成），这个意图就完成了，可以 end_activity。
  明确决定不发、或想了又咽回去时，也可以 end_activity 把这次开口收住。
  尚未决定时可以继续 advance_activity，让 compose 保持未决；犹豫本身不等于失败或已经发送。
duration_hint: short
produces: optional
requires: []
