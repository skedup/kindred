[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "kindred-capability-sdk"
version = "0.1.0"
description = "Portable capability contracts for Kindred"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]

[project.urls]
Repository = "https://github.com/skedup/kindred"
Issues = "https://github.com/skedup/kindred/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/kindred_capability_sdk"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/kindred_capability_sdk"]
