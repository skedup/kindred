[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "kindred-capability-compose"
version = "0.1.0"
description = "Portable compose capability for Kindred"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["kindred-capability-sdk>=0.1.0,<0.2"]

[project.urls]
Repository = "https://github.com/skedup/kindred"
Issues = "https://github.com/skedup/kindred/issues"

[project.entry-points."kindred.capability.v1"]
compose = "kindred_capability_compose.plugin:create_capability"

[tool.hatch.build.targets.wheel]
packages = ["src/kindred_capability_compose"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/kindred_capability_compose"]
