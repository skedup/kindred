name: Installation problem
description: Report a bootstrap, installer, doctor, or service setup failure.
title: "[Install]: "
labels: [installation]
body:
  - type: markdown
    attributes:
      value: >-
        Do not paste configuration, Persona, messages, addresses, debug dumps, session or
        account values, credentials, private keys, or resident data.
  - type: input
    id: version
    attributes:
      label: Release version
      placeholder: v0.1.0
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS 14+ arm64
        - Ubuntu 24.04 x86_64
    validations:
      required: true
  - type: textarea
    id: stage
    attributes:
      label: Failed stage and safe error
      description: Name the command and safe reason/check ID without private values.
    validations:
      required: true
  - type: textarea
    id: attempts
    attributes:
      label: Steps already attempted
